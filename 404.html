<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>ページが見つかりません | 合同会社らいとすぴりっつ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Zen+Maru+Gothic:wght@700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
/* 「灯りがない」と書いてあるページなので、夜側の配色で組む。
   色はすべて index.html にある既存の値。ここだけで完結させてあり、
   他ページには一切影響しない。調整用の値はこの :root だけ ↓ */
:root{
  /* 背景。夜空グラデーション（index.html の .night-sky）の
     Dialogue セクションがある帯から下を、そのまま採っている */
  --p-sky-1:#24406C;      /* 58% — Dialogue の青灰色 */
  --p-sky-2:#16294A;      /* 70% */
  --p-sky-3:#0A1529;      /* 85% */

  --p-ink:#F5E3B0;                    /* 見出し。夜側の淡い金 */
  --p-body:rgba(226,236,252,0.86);    /* 本文。夜側の既定 */
  --p-mute:rgba(226,236,252,0.72);    /* フッター。夜側のフッターと同じ */
  --p-gold:#E8C97A;                   /* 夜側の金 */
  --p-gold-2:#C9A84C;
  --p-on-gold:#0A1226;                /* 金の上に載せる文字。夜側の btn-gold と同じ */
  --p-line:rgba(232,201,122,0.22);    /* 罫線 */

  --p-flame-1:#FFF6D8;    /* 火色。index.html の .fuse-spark と同じ */
  --p-flame-2:#F5C842;
  --p-flame-3:rgba(245,166,35,0);
  --p-glow:0.5;           /* 雷神の足元の光の強さ */
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100svh;
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,
    var(--p-sky-1) 0%,
    var(--p-sky-2) 55%,
    var(--p-sky-3) 100%);
  background-attachment:fixed;
  font-family:'Noto Sans JP',sans-serif;
  color:var(--p-ink);
  line-height:2;
}

/* ===== ヘッダー（index.html のロゴと同じ組み） ===== */
.site-head{
  padding:1.4rem 2rem;
}
.site-logo{
  display:inline-flex;
  align-items:center;
  gap:0.6em;
  text-decoration:none;
  /* ロゴ画像は黒地に白の「魂」。暗い背景では黒地が沈み、白い字だけが残る */
  color:#EEF4FE;
}
.site-logo img{height:36px;width:auto;border-radius:4px}
.site-logo b{
  display:block;
  font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;
  font-size:0.95rem;
  line-height:1.4;
  letter-spacing:0.06em;
}
.site-logo-texts{display:block}
.site-logo-texts span{
  display:block;
  font-family:'Space Mono',monospace;
  font-size:0.62rem;
  letter-spacing:0.24em;
  color:var(--p-gold);
}

/* ===== 本体 — カードは置かない。
   雷神の足元の光だけが灯っている状態にするため、囲む枠を作らない ===== */
main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1rem 1.5rem 3rem;
}
.card{
  padding:2.6rem 2.8rem;
  max-width:760px;
  width:100%;
  text-align:center;
}
/* 860px 以上では雷神を横に置く。縦に積むと導線がすぐ下に隠れてしまうため。
   760px だと右カラムが狭く、副リンク3つが折り返す余地が残るので 860px にしてある */
@media(min-width:860px){
  .card{
    display:flex;
    align-items:center;
    gap:2.4rem;
    text-align:left;
  }
  .card-visual{flex:0 0 200px}
  .card-body{flex:1;min-width:0}
  /* 下の方に同じセレクタの指定があるので、こちらを1段強くしてある */
  .card .raizin{margin:0 auto}
  .card .go-list{justify-content:flex-start}
}
.card-code{
  font-family:'Space Mono',monospace;
  font-size:0.74rem;
  letter-spacing:0.2em;
  color:var(--p-gold);
  font-weight:700;
  line-height:1.6;
}

/* 雷神。ここが画面内で唯一の光源。動かさない（静的な灯り） */
.raizin{
  position:relative;
  width:180px;
  margin:1.2rem auto 0.4rem;
}
/* 遠くまで届くにじみ */
.raizin::after{
  content:'';
  position:absolute;
  left:50%;top:60%;
  width:420px;height:420px;
  margin:-210px 0 0 -210px;
  border-radius:50%;
  background:radial-gradient(circle,
    var(--p-flame-2) 0%,
    var(--p-flame-3) 62%);
  opacity:calc(var(--p-glow) * 0.34);
}
/* 足元の芯 */
.raizin::before{
  content:'';
  position:absolute;
  left:50%;top:58%;
  width:190px;height:190px;
  margin:-95px 0 0 -95px;
  border-radius:50%;
  background:radial-gradient(circle,
    var(--p-flame-1) 0%,
    var(--p-flame-2) 38%,
    var(--p-flame-3) 72%);
  opacity:var(--p-glow);
}
.raizin img{
  position:relative;
  display:block;
  width:100%;
  height:auto;
}

h1{
  font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;
  font-size:1.5rem;
  line-height:1.6;
  margin-bottom:1rem;
  color:var(--p-ink);
}
/* index.html の Dialogue にある雷神の吹き出しと同じ作り */
.raizin-line{
  display:inline-block;
  background:rgba(232,201,122,0.20);
  border:1px solid rgba(232,201,122,0.36);
  border-radius:14px;
  padding:0.6rem 1.2rem;
  font-size:0.88rem;
  color:#EEF4FE;
  line-height:1.8;
  margin-bottom:1.4rem;
}
.raizin-line b{
  display:block;
  font-size:0.7rem;
  letter-spacing:0.12em;
  color:var(--p-gold);
}
.lead{
  font-size:0.88rem;
  color:var(--p-body);
  margin-bottom:2rem;
}

/* 「明るいほう」へ向かうボタン。index.html の夜側 .btn-gold と同じ配色 */
.back-btn{
  display:inline-block;
  padding:0.85rem 2.4rem;
  background:linear-gradient(90deg,var(--p-gold),var(--p-gold-2));
  color:var(--p-on-gold);
  text-decoration:none;
  border-radius:50px;
  font-size:0.9rem;
  font-weight:700;
  box-shadow:0 4px 18px rgba(232,201,122,0.28);
  transition:transform .2s,box-shadow .2s;
}
.back-btn:hover{
  transform:translateY(-2px);
  background:linear-gradient(90deg,#F5E3B0,var(--p-gold));
  box-shadow:0 6px 24px rgba(232,201,122,0.40);
}

.go-list{
  list-style:none;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:0.6rem;
  margin-top:1.8rem;
  padding-top:1.6rem;
  border-top:1px solid var(--p-line);
}
.go-list a{
  display:block;
  padding:0.5rem 1.4rem;
  border:1px solid rgba(232,201,122,0.34);
  border-radius:50px;
  font-size:0.82rem;
  font-weight:700;
  color:var(--p-gold);
  text-decoration:none;
  transition:background .2s,border-color .2s,color .2s;
}
.go-list a:hover{
  background:rgba(232,201,122,0.10);
  border-color:var(--p-gold);
  color:#F5E3B0;
}

/* ===== フッター ===== */
.site-foot{
  padding:1.6rem 2rem 2.4rem;
  text-align:center;
  border-top:1px solid var(--p-line);
}
.site-foot p{
  font-family:'Space Mono',monospace;
  font-size:0.68rem;
  letter-spacing:0.18em;
  color:var(--p-gold);
  font-weight:700;
}
.foot-links{
  margin-top:0.6rem;
  font-size:0.74rem;
  line-height:1.8;
}
.foot-links a{color:var(--p-mute);text-decoration:none;margin:0 0.5rem}
.foot-links a:hover{color:var(--p-gold)}

@media(max-width:700px){
  .site-head{padding:1.1rem 1.2rem}
  main{padding:0.5rem 1rem 2rem}
  .card{padding:2rem 1.3rem 1.8rem;border-radius:18px}
  h1{font-size:1.2rem}
  .raizin{width:150px}
  /* 3つ並べる幅がないので縦に積む。1つだけ折り返して取り残されるのを避ける */
  .go-list{flex-direction:column;align-items:center}
  .go-list a{padding:0.5rem 1.4rem}
}
@media (prefers-reduced-motion:reduce){
  .back-btn{transition:none}
  .back-btn:hover{transform:none}
}
</style>
</head>
<body>

<!-- コンソールを開いた人へ。読み込み時に1回だけ出す。
     console.warn / console.error は本物の警告と混ざるので使わない。
     index.html の <body> 直後にある同じものの写し。文面を変えるときは両方直す -->
<script>
(function(){
  var art = [
    '',
    '       \\ | /',
    '   .-----------.',
    '   |  [o] [o]  |',
    '   |    ---    |',
    "   '--/-----\\--'",
    '      RAIZIN',
    ''
  ].join('\n');

  var msg = 'ここまで開いてくれて、ありがとう。\n'
          + 'つくることが好きな人と、話がしたいです。\n';

  var sign = '\n合同会社らいとすぴりっつ  info@lightspirits.jp\n';

  console.log(
    '%c' + art + '%c' + msg + '%c' + sign,
    'color:#C9A84C;font-family:monospace;line-height:1.15;font-size:12px',
    'font-family:sans-serif;font-size:13px;line-height:1.7',   /* 色は指定しない。devtools が暗い配色でも読めるように */
    'color:#0284C7;font-family:sans-serif;font-size:12px;font-weight:bold'
  );
})();
</script>

<header class="site-head">
  <a href="/" class="site-logo">
    <img src="/images/logo.jpg" alt="">
    <span class="site-logo-texts">
      <b>合同会社らいとすぴりっつ</b>
      <span>LIGHT SPIRITS</span>
    </span>
  </a>
</header>

<main>
  <div class="card">
    <div class="card-visual">
      <div class="raizin">
        <img src="/images/mascot-raizin.png" alt="あたりを見まわしている雷神" width="420" height="458">
      </div>
    </div>

    <div class="card-body">
      <p class="card-code">404 NOT FOUND</p>

      <h1>この先には、まだ灯りがない</h1>

      <p class="raizin-line"><b>雷神</b>ちょっと暗いね。明るいほうへ行こう。</p>

      <p class="lead">お探しのページが見つかりませんでした。<br>行き先はこちらです。</p>

      <a href="/" class="back-btn">トップページへ戻る</a>

      <ul class="go-list">
        <li><a href="/#about">会社について</a></li>
        <li><a href="/#services">サービス</a></li>
        <li><a href="/#contact">お問い合わせ</a></li>
      </ul>
    </div>
  </div>
</main>

<footer class="site-foot">
  <p>らいとすぴりっつ / LIGHT SPIRITS</p>
  <div class="foot-links">
    <a href="/privacy.html">プライバシーポリシー</a>
    <a href="/terms.html">利用規約</a>
    <a href="mailto:info@lightspirits.jp">info@lightspirits.jp</a>
  </div>
</footer>

</body>
</html>
