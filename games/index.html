<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="description" content="RAIZIN GAMES — 合同会社らいとすぴりっつのマスコット「雷神」が登場する、小さなゲーム置き場。仕事の合間にちょっと遊んでいきませんか。">
<title>RAIZIN GAMES | 合同会社らいとすぴりっつ</title>
<link rel="canonical" href="https://lightspirits.jp/games/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@300;400;700&family=Zen+Maru+Gothic:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RAIZIN GAMES
   会社HPの中に置いた、小さなゲームセンター。
   色はすべて index.html にある既存の値。新しい色は作っていない。
   このファイルだけで完結していて、他ページには影響しない。
   調整用の値は下の :root にまとまっている。
   ============================================================ */
:root{
  /* 背景。index.html の夜空グラデーションの stop をそのまま採っている */
  --g-sky-1:#24406C;
  --g-sky-2:#16294A;
  --g-sky-3:#0A1529;

  --g-ink:#F5E3B0;                  /* 見出し */
  --g-body:rgba(226,236,252,0.86);  /* 本文 */
  --g-mute:rgba(226,236,252,0.72);  /* 補足・フッター */
  --g-text:#EEF4FE;

  --g-gold:#E8C97A;                 /* 夜側の金 */
  --g-gold-2:#C9A84C;
  --g-gold-dim:#B99B57;
  --g-on-gold:#0A1226;              /* 金の上に載せる文字 */

  --g-glass:rgba(12,22,42,0.55);    /* カードの地。Dialogue の会話パネルと同じ */
  --g-line:rgba(232,201,122,0.22);  /* 罫線 */

  --g-flame-1:#FFF6D8;              /* 火色。index.html の .fuse-spark と同じ */
  --g-flame-2:#F5C842;
  --g-flame-3:rgba(245,166,35,0);

  --g-card-min:280px;               /* カードの最小幅。列数はここで決まる */
  --g-lift:-4px;                    /* ホバーで浮く量 */
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100svh;
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,
    var(--g-sky-1) 0%,
    var(--g-sky-2) 45%,
    var(--g-sky-3) 100%);
  background-attachment:fixed;
  font-family:'Noto Sans JP',sans-serif;
  font-weight:300;
  color:var(--g-body);
  line-height:2;
}

/* ===== ヘッダー（404.html と同じ組み） ===== */
.site-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  flex-wrap:wrap;
  padding:1.4rem 2rem;
}
.site-logo{
  display:inline-flex;
  align-items:center;
  gap:0.6em;
  text-decoration:none;
  color:var(--g-text);
}
.site-logo img{height:36px;width:auto;border-radius:4px}
.site-logo b{
  display:block;
  font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;
  font-size:0.95rem;
  line-height:1.4;
  letter-spacing:0.06em;
}
.site-logo-texts{display:block}
.site-logo-texts span{
  display:block;
  font-family:'Space Mono',monospace;
  font-size:0.62rem;
  letter-spacing:0.24em;
  color:var(--g-gold);
}
/* 迷子にならないよう、上にも戻り道を置く */
.back-link{
  font-size:0.8rem;
  font-weight:400;
  color:var(--g-gold);
  text-decoration:none;
  border:1px solid rgba(232,201,122,0.34);
  border-radius:50px;
  padding:0.4rem 1.2rem;
  transition:background .2s,border-color .2s,color .2s;
}
.back-link:hover{background:rgba(232,201,122,0.10);border-color:var(--g-gold);color:#F5E3B0}

main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:1rem 1.5rem 4rem}

/* ===== 見出し ===== */
.g-hero{text-align:center;padding:1.5rem 0 3rem}
.g-title{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:clamp(2.2rem,7vw,4.2rem);
  letter-spacing:0.06em;
  line-height:1.1;
  color:var(--g-text);
  /* ネオン。動かさず、にじませるだけ */
  text-shadow:0 0 18px rgba(232,201,122,0.30),0 0 46px rgba(245,200,66,0.14);
}
.g-title .accent{color:var(--g-gold)}
.g-title-jp{
  font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;
  font-weight:700;
  font-size:clamp(1rem,2.4vw,1.35rem);
  letter-spacing:0.1em;
  color:var(--g-ink);
  margin-top:0.6rem;
}
.g-lead{
  font-size:0.9rem;
  line-height:2;
  color:var(--g-body);
  margin:1.4rem auto 0;
  max-width:40em;
}

/* 案内役の雷神。主役にはしない */
.g-raizin{
  display:inline-flex;
  align-items:center;
  gap:1rem;
  margin-top:2rem;
  text-align:left;
}
.g-raizin-img{position:relative;width:104px;flex-shrink:0}
.g-raizin-img::before{
  content:'';
  position:absolute;
  left:50%;top:58%;
  width:150px;height:150px;
  margin:-75px 0 0 -75px;
  border-radius:50%;
  background:radial-gradient(circle,
    var(--g-flame-1) 0%,
    var(--g-flame-2) 38%,
    var(--g-flame-3) 72%);
  opacity:0.34;
}
.g-raizin-img img{position:relative;display:block;width:100%;height:auto}
/* index.html の Dialogue にある雷神の吹き出しと同じ作り */
.g-raizin-line{
  background:rgba(232,201,122,0.20);
  border:1px solid rgba(232,201,122,0.36);
  border-radius:14px;
  padding:0.6rem 1.2rem;
  font-size:0.9rem;
  line-height:1.8;
  color:var(--g-text);
}
.g-raizin-line b{
  display:block;
  font-size:0.68rem;
  letter-spacing:0.12em;
  color:var(--g-gold);
}

/* ===== 一覧 ===== */
.g-grid{
  list-style:none;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--g-card-min),1fr));
  gap:1.4rem;
}
.g-card{
  position:relative;
  display:flex;
  flex-direction:column;
  background:var(--g-glass);
  border:1px solid var(--g-line);
  border-radius:16px;
  overflow:hidden;
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
/* 上端に走る光。ふだんは消えていて、ホバーのときだけ流れる */
.g-card::before{
  content:'';
  position:absolute;
  left:0;right:0;top:0;
  height:2px;
  background:linear-gradient(90deg,
    transparent,
    var(--g-flame-2),
    var(--g-gold),
    transparent);
  opacity:0;
  transition:opacity .22s ease;
}
.g-card.is-live:hover{
  transform:translateY(var(--g-lift));
  border-color:rgba(232,201,122,0.55);
  box-shadow:0 10px 30px rgba(0,0,0,0.32),0 0 22px rgba(232,201,122,0.14);
}
.g-card.is-live:hover::before{opacity:1}
.g-card:focus-within{border-color:rgba(232,201,122,0.55)}
.g-card:focus-within::before{opacity:1}

/* 看板。画像がないゲームは、ゲーセンの筐体マーキー風に組む */
.g-thumb{
  position:relative;
  aspect-ratio:16/9;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(rgba(232,201,122,0.07) 1px,transparent 1px) 0 0/100% 22px,
    linear-gradient(90deg,rgba(232,201,122,0.07) 1px,transparent 1px) 0 0/22px 100%,
    radial-gradient(ellipse 70% 80% at 50% 120%,rgba(245,200,66,0.16),transparent 70%),
    #0E1B33;
  border-bottom:1px solid var(--g-line);
  overflow:hidden;
}
.g-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.g-thumb-mark{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0.5rem;
  padding:0 1rem;
}
.g-thumb-bolt{
  width:26px;height:26px;
  filter:drop-shadow(0 0 10px rgba(245,200,66,0.55));
}
.g-thumb-en{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:0.82rem;
  letter-spacing:0.22em;
  color:var(--g-gold);
  text-align:center;
  line-height:1.5;
}

.g-body{padding:1.2rem 1.3rem 1.4rem;display:flex;flex-direction:column;flex:1}
.g-badges{display:flex;gap:0.4rem;min-height:1.2rem;margin-bottom:0.4rem}
.g-badge{
  font-family:'Space Mono',monospace;
  font-size:0.62rem;
  font-weight:700;
  letter-spacing:0.16em;
  padding:0.1rem 0.6rem;
  border-radius:50px;
}
.g-badge.is-new{background:var(--g-gold);color:var(--g-on-gold)}
.g-badge.is-soon{
  background:transparent;
  border:1px solid rgba(232,201,122,0.40);
  color:var(--g-gold-dim);
}
.g-name{
  font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;
  font-weight:700;
  font-size:1.05rem;
  line-height:1.5;
  color:var(--g-ink);
}
.g-desc{
  font-size:0.82rem;
  line-height:1.9;
  color:var(--g-body);
  margin-top:0.5rem;
}
.g-tags{list-style:none;display:flex;flex-wrap:wrap;gap:0.35rem;margin-top:0.8rem}
.g-tags li{
  font-size:0.68rem;
  letter-spacing:0.06em;
  color:var(--g-mute);
  border:1px solid rgba(150,185,235,0.38);
  background:rgba(126,166,226,0.14);
  border-radius:50px;
  padding:0.05rem 0.7rem;
  line-height:1.8;
}
/* 将来ここにプレイ済み・ハイスコア・称号などを出す。
   data/games.js に項目を足して renderMeta() を書けば、この位置に並ぶ */
.g-meta:not(:empty){
  margin-top:0.8rem;
  padding-top:0.7rem;
  border-top:1px solid var(--g-line);
  font-family:'Space Mono',monospace;
  font-size:0.7rem;
  letter-spacing:0.08em;
  color:var(--g-gold-dim);
}
.g-foot{margin-top:auto;padding-top:1.1rem}
.g-play{
  display:block;
  text-align:center;
  padding:0.7rem 1.4rem;
  border-radius:50px;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:0.86rem;
  letter-spacing:0.18em;
  text-decoration:none;
  background:linear-gradient(90deg,var(--g-gold),var(--g-gold-2));
  color:var(--g-on-gold);
  box-shadow:0 4px 18px rgba(232,201,122,0.22);
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}
.g-play:hover{
  transform:translateY(-2px);
  background:linear-gradient(90deg,#F5E3B0,var(--g-gold));
  box-shadow:0 6px 24px rgba(232,201,122,0.38);
}
.g-play:active{transform:translateY(0)}
/* まだ遊べないものは押せない */
.g-play.is-off{
  background:none;
  border:1px dashed rgba(232,201,122,0.40);
  color:var(--g-gold-dim);
  box-shadow:none;
  cursor:default;
}

/* 「次のゲーム、開発中。」のカード */
.g-card.is-next{
  background:rgba(12,22,42,0.32);
  border-style:dashed;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:2.2rem 1.4rem;
  min-height:220px;
}
.g-card.is-next .g-next-title{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:0.9rem;
  letter-spacing:0.24em;
  color:var(--g-gold-dim);
}
.g-card.is-next .g-next-desc{font-size:0.84rem;color:var(--g-body);margin-top:0.5rem}
.g-card.is-next .g-next-line{
  margin-top:1rem;
  font-size:0.8rem;
  color:var(--g-gold);
}
.g-card.is-next .g-next-line b{
  font-family:'Space Mono',monospace;
  font-size:0.62rem;
  letter-spacing:0.16em;
  color:var(--g-gold-dim);
  display:block;
}

.g-note{
  margin-top:2.4rem;
  text-align:center;
  font-size:0.8rem;
  color:var(--g-mute);
}
.g-note a{color:var(--g-gold)}

/* ===== フッター ===== */
.site-foot{
  padding:2rem 2rem 2.6rem;
  text-align:center;
  border-top:1px solid var(--g-line);
}
.back-btn{
  display:inline-block;
  padding:0.85rem 2.4rem;
  margin-bottom:1.6rem;
  background:linear-gradient(90deg,var(--g-gold),var(--g-gold-2));
  color:var(--g-on-gold);
  text-decoration:none;
  border-radius:50px;
  font-size:0.9rem;
  font-weight:700;
  box-shadow:0 4px 18px rgba(232,201,122,0.28);
  transition:transform .2s,box-shadow .2s,background .2s;
}
.back-btn:hover{
  transform:translateY(-2px);
  background:linear-gradient(90deg,#F5E3B0,var(--g-gold));
  box-shadow:0 6px 24px rgba(232,201,122,0.40);
}
.site-foot p{
  font-family:'Space Mono',monospace;
  font-size:0.68rem;
  letter-spacing:0.18em;
  color:var(--g-gold);
  font-weight:700;
}
.foot-links{margin-top:0.6rem;font-size:0.74rem;line-height:1.8}
.foot-links a{color:var(--g-mute);text-decoration:none;margin:0 0.5rem}
.foot-links a:hover{color:var(--g-gold)}

@media(max-width:700px){
  .site-head{padding:1.1rem 1.2rem}
  main{padding:0.5rem 1rem 3rem}
  .g-hero{padding:1rem 0 2.2rem}
  .g-raizin{flex-direction:column;text-align:center;gap:0.6rem}
  .g-raizin-img{width:120px}
  .g-grid{gap:1.1rem}
}

/* 動きを減らす設定のときは、浮きも光の走りも止める */
@media (prefers-reduced-motion:reduce){
  .g-card,.g-card::before,.g-play,.back-btn,.back-link{transition:none}
  .g-card.is-live:hover{transform:none}
  .g-play:hover,.back-btn:hover{transform:none}
}
</style>
</head>
<body>

<header class="site-head">
  <a href="/" class="site-logo">
    <img src="/images/logo.jpg" alt="">
    <span class="site-logo-texts">
      <b>合同会社らいとすぴりっつ</b>
      <span>LIGHT SPIRITS</span>
    </span>
  </a>
  <a href="/" class="back-link">← らいとすぴりっつへ戻る</a>
</header>

<main>
  <div class="g-hero">
    <h1 class="g-title">RAIZIN <span class="accent">GAMES</span></h1>
    <p class="g-title-jp">雷神と遊ぼう。</p>
    <p class="g-lead">
      らいとすぴりっつのマスコット「雷神」が登場する、小さなゲーム置き場です。<br>
      仕事の合間に、ちょっと遊んでいきませんか？
    </p>
    <div class="g-raizin">
      <div class="g-raizin-img">
        <img src="/images/mascot-raizin.png" alt="案内する雷神" width="420" height="458">
      </div>
      <p class="g-raizin-line"><b>雷神</b>遊んでいく？</p>
    </div>
  </div>

  <ul class="g-grid" id="gameGrid"></ul>

  <noscript>
    <p class="g-note">
      ゲーム一覧の表示には JavaScript が必要です。
      有効にしてから読み込み直してください。
      お問い合わせは <a href="/#contact">こちら</a> から。
    </p>
  </noscript>
</main>

<footer class="site-foot">
  <a href="/" class="back-btn">← らいとすぴりっつへ戻る</a>
  <p>らいとすぴりっつ / LIGHT SPIRITS</p>
  <div class="foot-links">
    <a href="/privacy.html">プライバシーポリシー</a>
    <a href="/terms.html">サイトポリシー</a>
    <a href="mailto:info@lightspirits.jp">info@lightspirits.jp</a>
  </div>
</footer>

<script src="/data/games.js"></script>
<script>
/* 一覧は data/games.js から組み立てる。
   ゲームを足すときに、このファイルを触る必要はない */
(function(){
  var grid = document.getElementById('gameGrid');
  if (!grid) return;

  var list = window.LS_GAMES || [];
  var next = window.LS_GAMES_NEXT;

  // 稲妻。画像ではなく形だけなので、素材を増やさずに済む
  var BOLT = '<svg class="g-thumb-bolt" viewBox="0 0 24 24" aria-hidden="true">'
           + '<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="#E8C97A"/></svg>';

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
  function nl(s){ return esc(s).replace(/\n/g,'<br>'); }

  /* 将来ここを書く。data/games.js に足した項目
     （プレイ済み・ハイスコア・称号など）をこの中で組み立てると、
     説明とボタンの間に出る。今は何も出さない */
  function renderMeta(g){
    return '';
  }

  function card(g){
    var live = !!g.url;
    var thumb = g.thumb
      ? '<img src="' + esc(g.thumb) + '" alt="">'
      : '<span class="g-thumb-mark">' + BOLT
        + '<span class="g-thumb-en">' + esc(g.en || g.name) + '</span></span>';

    // 遊べないものに NEW を付けると意味が食い違うので、どちらか一方だけ出す
    var badges = live
      ? (g.isNew ? '<span class="g-badge is-new">NEW</span>' : '')
      : '<span class="g-badge is-soon">COMING SOON</span>';

    var tags = (g.tags && g.tags.length)
      ? '<ul class="g-tags">' + g.tags.map(function(t){
          return '<li>' + esc(t) + '</li>';
        }).join('') + '</ul>'
      : '';

    var btn = live
      ? '<a class="g-play" href="' + esc(g.url) + '">PLAY</a>'
      : '<span class="g-play is-off">COMING SOON</span>';

    return '<li class="g-card' + (live ? ' is-live' : '') + '" id="game-' + esc(g.id) + '">'
         +   '<div class="g-thumb">' + thumb + '</div>'
         +   '<div class="g-body">'
         +     '<div class="g-badges">' + badges + '</div>'
         +     '<h2 class="g-name">' + esc(g.name) + '</h2>'
         +     '<p class="g-desc">' + nl(g.desc) + '</p>'
         +     tags
         +     '<div class="g-meta">' + renderMeta(g) + '</div>'
         +     '<div class="g-foot">' + btn + '</div>'
         +   '</div>'
         + '</li>';
  }

  var html = list.map(card).join('');

  if (next) {
    html += '<li class="g-card is-next">'
          +   '<p class="g-next-title">' + esc(next.title) + '</p>'
          +   '<p class="g-next-desc">' + esc(next.desc) + '</p>'
          +   (next.line
              ? '<p class="g-next-line"><b>雷神</b>' + esc(next.line) + '</p>'
              : '')
          + '</li>';
  }

  grid.innerHTML = html;
})();
</script>

</body>
</html>
