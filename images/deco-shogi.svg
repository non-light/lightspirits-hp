<svg viewBox="0 0 280 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Back piece: yellow-gold, rotated right -->
  <g transform="rotate(16 140 152)" opacity="0.8">
    <path d="M140,34 L222,88 L212,242 L68,242 L58,88 Z" fill="#FCD34D"/>
    <path d="M140,50 L208,98 L199,228 L81,228 L72,98 Z" fill="none" stroke="#D97706" stroke-width="2.5"/>
    <text x="140" y="178" font-family="Georgia,'Times New Roman',serif" font-size="78" fill="#92400E" text-anchor="middle" font-weight="bold">飛</text>
  </g>

  <!-- Front piece: purple, rotated left -->
  <g transform="rotate(-13 140 152)">
    <filter id="sh" x="-10%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#4C1D95" flood-opacity="0.3"/>
    </filter>
    <path d="M140,34 L222,88 L212,242 L68,242 L58,88 Z" fill="#7C3AED" filter="url(#sh)"/>
    <!-- Shine -->
    <path d="M140,34 L222,88 L186,58 Z" fill="rgba(255,255,255,0.22)"/>
    <!-- Inner border -->
    <path d="M140,50 L208,98 L199,228 L81,228 L72,98 Z" fill="none" stroke="#6D28D9" stroke-width="2.5"/>
    <!-- Kanji: 王 -->
    <text x="140" y="178" font-family="Georgia,'Times New Roman',serif" font-size="78" fill="white" text-anchor="middle" font-weight="bold">王</text>
  </g>

  <!-- Small sparkle dots -->
  <circle cx="34" cy="50" r="5" fill="#FCD34D" opacity="0.8"/>
  <circle cx="248" cy="260" r="4" fill="#A78BFA" opacity="0.8"/>
</svg>
