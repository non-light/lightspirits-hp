  <circle cx="28" cy="290" r="6" fill="#F87171" opacity="0.75"/>
  <circle cx="274" cy="252" r="8" fill="#A78BFA" opacity="0.8"/>
  <path d="M260 348 l3 9 l9 3 l-9 3 l-3 9 l-3-9 l-9-3 l9-3 Z" fill="#FCD34D" opacity="0.85"/>
  <path d="M38 330 l2.5 7 l7 2.5 l-7 2.5 l-2.5 7 l-2.5-7 l-7-2.5 l7-2.5 Z" fill="#93C5FD" opacity="0.85"/>

