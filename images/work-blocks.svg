<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="480" height="360" fill="#0F172A" rx="0"/>

  <!-- Subtle grid background -->
  <line x1="0" y1="60" x2="480" y2="60" stroke="#1E293B" stroke-width="1"/>
  <line x1="0" y1="120" x2="480" y2="120" stroke="#1E293B" stroke-width="1"/>
  <line x1="0" y1="180" x2="480" y2="180" stroke="#1E293B" stroke-width="1"/>
  <line x1="0" y1="240" x2="480" y2="240" stroke="#1E293B" stroke-width="1"/>
  <line x1="0" y1="300" x2="480" y2="300" stroke="#1E293B" stroke-width="1"/>
  <line x1="60" y1="0" x2="60" y2="360" stroke="#1E293B" stroke-width="1"/>
  <line x1="120" y1="0" x2="120" y2="360" stroke="#1E293B" stroke-width="1"/>
  <line x1="180" y1="0" x2="180" y2="360" stroke="#1E293B" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="360" stroke="#1E293B" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="360" stroke="#1E293B" stroke-width="1"/>
  <line x1="360" y1="0" x2="360" y2="360" stroke="#1E293B" stroke-width="1"/>
  <line x1="420" y1="0" x2="420" y2="360" stroke="#1E293B" stroke-width="1"/>

  <!-- Block pile (bottom layer) -->
  <rect x="120" y="270" width="58" height="58" rx="6" fill="#EF4444"/>
  <rect x="180" y="270" width="58" height="58" rx="6" fill="#3B82F6"/>
  <rect x="240" y="270" width="58" height="58" rx="6" fill="#22C55E"/>
  <rect x="300" y="270" width="58" height="58" rx="6" fill="#EF4444"/>

  <!-- Block edge highlights -->
  <rect x="122" y="272" width="54" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="182" y="272" width="54" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="242" y="272" width="54" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="302" y="272" width="54" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>

  <!-- Second layer -->
  <rect x="150" y="210" width="58" height="58" rx="6" fill="#F59E0B"/>
  <rect x="210" y="210" width="58" height="58" rx="6" fill="#8B5CF6"/>
  <rect x="270" y="210" width="58" height="58" rx="6" fill="#06B6D4"/>
  <rect x="152" y="212" width="54" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="212" y="212" width="54" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="272" y="212" width="54" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>

  <!-- Third layer -->
  <rect x="180" y="150" width="58" height="58" rx="6" fill="#EF4444"/>
  <rect x="240" y="150" width="58" height="58" rx="6" fill="#22C55E"/>
  <rect x="182" y="152" width="54" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="242" y="152" width="54" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>

  <!-- Falling blocks (top, slightly rotated) -->
  <rect x="200" y="50" width="52" height="52" rx="6" fill="#F59E0B" transform="rotate(8 226 76)"/>
  <rect x="202" y="52" width="48" height="7" rx="3" fill="rgba(255,255,255,0.2)" transform="rotate(8 226 76)"/>

  <rect x="290" y="80" width="52" height="52" rx="6" fill="#8B5CF6" transform="rotate(-6 316 106)"/>
  <rect x="292" y="82" width="48" height="7" rx="3" fill="rgba(255,255,255,0.2)" transform="rotate(-6 316 106)"/>

  <rect x="110" y="100" width="52" height="52" rx="6" fill="#06B6D4" transform="rotate(12 136 126)"/>
  <rect x="112" y="102" width="48" height="7" rx="3" fill="rgba(255,255,255,0.2)" transform="rotate(12 136 126)"/>

  <!-- Title -->
  <text x="240" y="34" font-family="'Space Grotesk','Arial',sans-serif" font-size="18" fill="#94A3B8" text-anchor="middle" font-weight="700" letter-spacing="2">BreakBlockBuild</text>
</svg>
