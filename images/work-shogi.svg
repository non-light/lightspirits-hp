<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="480" height="360" fill="#FEF3C7" rx="0"/>

  <!-- Decorative circles -->
  <circle cx="420" cy="50" r="60" fill="#FDE68A" opacity="0.5"/>
  <circle cx="60" cy="310" r="80" fill="#FDE68A" opacity="0.4"/>

  <!-- Board -->
  <rect x="88" y="28" width="304" height="268" rx="10" fill="#B45309"/>
  <rect x="96" y="36" width="288" height="252" rx="8" fill="#D97706"/>

  <!-- Grid: 4 columns × 4 rows = 72px cells -->
  <line x1="168" y1="36" x2="168" y2="288" stroke="#B45309" stroke-width="1.5" opacity="0.7"/>
  <line x1="240" y1="36" x2="240" y2="288" stroke="#B45309" stroke-width="1.5" opacity="0.7"/>
  <line x1="312" y1="36" x2="312" y2="288" stroke="#B45309" stroke-width="1.5" opacity="0.7"/>
  <line x1="96" y1="99" x2="384" y2="99" stroke="#B45309" stroke-width="1.5" opacity="0.7"/>
  <line x1="96" y1="162" x2="384" y2="162" stroke="#B45309" stroke-width="1.5" opacity="0.7"/>
  <line x1="96" y1="225" x2="384" y2="225" stroke="#B45309" stroke-width="1.5" opacity="0.7"/>

  <!-- Piece helper: simple pentagon for shogi piece -->
  <!-- cell(0,0): 王 white piece -->
  <path d="M132,44 L162,58 L158,92 L106,92 L102,58 Z" fill="#F5F0DC"/>
  <path d="M132,44 L162,58 L144,50 Z" fill="rgba(255,255,255,0.4)"/>
  <text x="132" y="82" font-family="Georgia,serif" font-size="24" fill="#1E3A5F" text-anchor="middle" font-weight="bold">王</text>

  <!-- cell(2,0): 飛 white piece -->
  <path d="M276,44 L306,58 L302,92 L250,92 L246,58 Z" fill="#F5F0DC"/>
  <text x="276" y="82" font-family="Georgia,serif" font-size="24" fill="#1E3A5F" text-anchor="middle" font-weight="bold">飛</text>

  <!-- cell(1,1): 召 purple opponent piece (flipped) -->
  <g transform="rotate(180 204 131)">
    <path d="M204,107 L234,121 L230,155 L178,155 L174,121 Z" fill="#8B5CF6"/>
    <text x="204" y="145" font-family="Georgia,serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">召</text>
  </g>

  <!-- cell(3,2): 角 white piece -->
  <path d="M348,170 L378,184 L374,218 L322,218 L318,184 Z" fill="#F5F0DC"/>
  <text x="348" y="208" font-family="Georgia,serif" font-size="24" fill="#1E3A5F" text-anchor="middle" font-weight="bold">角</text>

  <!-- cell(0,3): 金 purple piece flipped -->
  <g transform="rotate(180 132 257)">
    <path d="M132,233 L162,247 L158,281 L106,281 L102,247 Z" fill="#A78BFA"/>
    <text x="132" y="271" font-family="Georgia,serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">金</text>
  </g>

  <!-- Title banner -->
  <rect x="108" y="305" width="264" height="44" rx="22" fill="#7C3AED"/>
  <text x="240" y="333" font-family="'Noto Sans JP',Hiragino Sans,sans-serif" font-size="19" fill="white" text-anchor="middle" font-weight="700">召喚将棋</text>
</svg>
