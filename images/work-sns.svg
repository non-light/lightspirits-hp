  <circle cx="360" cy="100" r="6" fill="#A78BFA"/>

  <circle cx="80" cy="240" r="22" fill="#1E1B4B"/>
  <circle cx="80" cy="240" r="22" fill="none" stroke="#4338CA" stroke-width="2"/>
  <circle cx="80" cy="240" r="9" fill="#6366F1"/>

  <circle cx="400" cy="250" r="22" fill="#1E1B4B"/>
