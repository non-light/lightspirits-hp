  <line x1="240" y1="180" x2="80" y2="240" stroke="#7C3AED" stroke-width="1.5" opacity="0.6"/>
  <line x1="240" y1="180" x2="400" y2="250" stroke="#7C3AED" stroke-width="1.5" opacity="0.6"/>
  <line x1="240" y1="180" x2="200" y2="310" stroke="#4338CA" stroke-width="1.5" opacity="0.6"/>
