<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>送信ありがとうございました | 合同会社らいとすぴりっつ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,#D8EEFC 0%,#F0F9FF 60%,#FFF9F0 100%);
  font-family:'Noto Sans JP',sans-serif;
  color:#0C3A56;
  padding:2rem 1.5rem;
}
.thanks-card{
  background:#FFFFFF;
  border-radius:26px;
  box-shadow:0 8px 36px rgba(2,132,199,0.12);
  padding:3.2rem 2.6rem;
  max-width:480px;
  width:100%;
  text-align:center;
}
.thanks-mark{
  width:64px;height:64px;
  margin:0 auto 1.4rem;
  border-radius:50%;
  background:radial-gradient(circle,#FFF6D8 0%,#F5C842 55%,rgba(245,166,35,0) 78%);
  box-shadow:0 0 18px 6px rgba(245,200,66,0.45);
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;
}
h1{
  font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;
  font-size:1.35rem;
  margin-bottom:1rem;
  line-height:1.6;
}
p{
  font-size:0.9rem;
  color:#3b5566;
  line-height:2;
  margin-bottom:2rem;
}
.back-btn{
  display:inline-block;
  padding:0.85rem 2.4rem;
  background:linear-gradient(135deg,#0284C7,#38BDF8);
  color:#fff;
  text-decoration:none;
  border-radius:50px;
  font-size:0.9rem;
  font-weight:700;
  box-shadow:0 4px 16px rgba(2,132,199,0.28);
  transition:box-shadow 0.2s,transform 0.2s;
}
.back-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(2,132,199,0.36)}
.thanks-brand{
  margin-top:2.2rem;
  font-size:0.72rem;
  letter-spacing:0.18em;
  color:#C9A84C;
  font-weight:700;
}
</style>
</head>
<body>
<div class="thanks-card">
  <div class="thanks-mark">🔥</div>
  <h1>お問い合わせ<br>ありがとうございました</h1>
  <p>内容を確認のうえ、ご入力いただいたメールアドレスへご連絡いたします。いましばらくお待ちください。</p>
  <a href="https://lightspirits.jp/" class="back-btn">トップページへ戻る</a>
  <p class="thanks-brand">らいとすぴりっつ / LIGHT SPIRITS</p>
</div>
</body>
</html>
